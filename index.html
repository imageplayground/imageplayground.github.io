<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IMG 店員助手">
<meta name="theme-color" content="#40B5A5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>IMG 店員助手</title>
<style>
  html,body{margin:0;height:100%;background:#40B5A5;overflow:hidden;}
  #f{position:fixed;inset:0;border:0;width:100%;height:100%;background:#f3f8f6;}
  #s{position:fixed;inset:0;background:linear-gradient(160deg,#4cc0b0,#40B5A5 55%,#2f8f82);
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:2;transition:opacity .45s;}
  #s img{width:118px;height:118px;border-radius:26px;background:#fff;padding:9px;box-sizing:border-box;box-shadow:0 10px 26px rgba(0,0,0,.22);}
  #s .t{color:#fff;font:800 21px -apple-system,"PingFang HK",sans-serif;letter-spacing:.5px;}
  #s a{margin-top:6px;color:#fff;font:600 15px -apple-system,"PingFang HK",sans-serif;opacity:.92;text-decoration:underline;}
</style>
</head>
<body>
  <div id="s">
    <img src="apple-touch-icon.png" alt="IMG">
    <div class="t">IMG 店員助手</div>
    <a id="open" href="https://script.google.com/macros/s/AKfycbyvoP33UIINAsBdm5X0FXTq0Qp6sFcvYshJOKyzziASDqjiyDV_Q3yxWn1GlRAMQOQY/exec" target="_top">載入中…</a>
  </div>
  <iframe id="f" src="https://script.google.com/macros/s/AKfycbyvoP33UIINAsBdm5X0FXTq0Qp6sFcvYshJOKyzziASDqjiyDV_Q3yxWn1GlRAMQOQY/exec" allow="clipboard-write; microphone; camera"></iframe>
  <script>
    var f=document.getElementById('f'), s=document.getElementById('s'), o=document.getElementById('open');
    var loaded=false;
    f.addEventListener('load', function(){ loaded=true; setTimeout(function(){ s.style.opacity='0'; setTimeout(function(){s.style.display='none';},450); },350); });
    setTimeout(function(){ if(!loaded){ o.textContent='撳我開個 app（要登入公司帳戶）'; } }, 6000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IMG 店員助手">
<meta name="theme-color" content="#40B5A5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>IMG 店員助手</title>
<style>
  :root{ --teal:#40B5A5; --teal2:#2f8f82; --coral:#E05B48; --bg:#f3f8f6; --ink:#1f2a28; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang HK","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---------- GATE ---------- */
  #gate{position:fixed;inset:0;z-index:20;background:linear-gradient(165deg,#4cc0b0,#40B5A5 52%,#2f8f82);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));gap:14px;}
  #gate .logo{width:96px;height:96px;border-radius:24px;background:#fff;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.24);}
  #gate h1{color:#fff;font-size:21px;font-weight:800;margin:6px 0 2px;letter-spacing:.5px;}
  #gate .sub{color:#eafff9;font-size:13px;margin-bottom:8px;opacity:.9;text-align:center;}
  .card{width:100%;max-width:320px;background:#fff;border-radius:18px;padding:18px 16px;box-shadow:0 14px 34px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px;}
  .card label{font-size:12px;color:#5b6b68;margin:2px 2px -6px;}
  #pin{width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:14px;border:1.5px solid #d7e4e0;border-radius:12px;background:#fbfdfc;color:var(--ink);font-weight:700;}
  #pin:focus{outline:none;border-color:var(--teal);}
  .go{background:var(--teal);color:#fff;font-size:18px;font-weight:800;border:0;border-radius:12px;padding:14px;margin-top:2px;}
  .go:active{background:var(--teal2);}
  .go:disabled{opacity:.55;}
  .err{color:var(--coral);font-size:13px;min-height:16px;text-align:center;}
  .hint{color:#7d8c88;font-size:12px;text-align:center;margin-top:-2px;}

  /* ---------- CHAT ---------- */
  header{background:var(--teal);color:#fff;display:flex;align-items:center;gap:10px;
         padding:calc(10px + env(safe-area-inset-top)) 14px 10px;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  header img{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px;}
  header .ttl{font-size:17px;font-weight:800;}
  header .badge{margin-left:auto;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:700;padding:5px 11px;border-radius:20px;}
  #notice{background:#fff7ec;color:#8a5a1a;border-bottom:1px solid #f0dcc0;font-size:14px;line-height:1.5;padding:10px 14px;display:none;}
  #notice b{color:var(--coral);}
  #msgs{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 6px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;}
  .row.me{justify-content:flex-end;}
  .bub{max-width:82%;font-size:18px;line-height:1.5;padding:11px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;}
  .bot .bub{background:#fff;border:1px solid #e4efec;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .me .bub{background:var(--teal);color:#fff;border-bottom-right-radius:5px;}
  .typing .bub{color:#8aa19c;font-style:italic;}
  footer{flex:0 0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
          background:#fff;border-top:1px solid #e7efec;}
  #q{flex:1;font-size:17px;line-height:1.4;padding:11px 14px;border:1.5px solid #d7e4e0;border-radius:22px;background:#fbfdfc;max-height:120px;resize:none;}
  #q:focus{outline:none;border-color:var(--teal);}
  #send{flex:0 0 auto;background:var(--teal);color:#fff;font-size:17px;font-weight:800;border:0;border-radius:22px;padding:11px 20px;}
  #send:active{background:var(--teal2);}
  #send:disabled{opacity:.5;}

  /* ---------- 今日流程 ---------- */
  header .plan-btn{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:14px;font-weight:800;padding:6px 11px;border-radius:10px;}
  header .plan-btn:active{background:rgba(255,255,255,.34);}
  #plan{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;}
  #plan .ph{background:var(--teal);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  #plan .ph .t{font-size:17px;font-weight:800;}
  #plan .ph .x{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;font-size:16px;font-weight:800;width:34px;height:34px;border-radius:10px;}
  #plan .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(20px + env(safe-area-inset-bottom));}
  .seg{background:#fff;border:1px solid #e4efec;border-radius:14px;margin-bottom:12px;overflow:hidden;}
  .seg>.sh{display:flex;align-items:center;gap:8px;padding:13px 14px;font-size:16px;font-weight:800;}
  .seg>.sh .chev{color:#9bb0ab;transition:transform .2s;}
  .seg.open>.sh .chev{transform:rotate(90deg);}
  .seg>.sh .now{font-size:11px;font-weight:800;color:#fff;background:var(--coral);padding:2px 7px;border-radius:6px;}
  .seg>.sh .cnt{margin-left:auto;font-size:13px;font-weight:800;color:var(--teal2);background:#eef7f5;padding:3px 10px;border-radius:20px;}
  .seg .items{display:none;padding:0 8px 6px;}
  .seg.open .items{display:block;}
  .it{display:flex;gap:11px;align-items:flex-start;padding:10px 8px;border-top:1px solid #f0f5f3;}
  .it .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid #cfe0db;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;}
  .it.done .box{background:var(--teal);border-color:var(--teal);}
  .it .tx{font-size:15.5px;line-height:1.45;}
  .it.done .tx{color:#9aa8a4;text-decoration:line-through;}
  #plan .tip{font-size:12px;color:#8a9894;text-align:center;padding:2px 10px 12px;}
  .kpi{padding:10px 12px 0;}
  .kpi-in{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e4efec;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .kpi-in.hit{background:linear-gradient(120deg,#eafaf6,#dff5ef);border-color:#bfe6da;}
  .kpi-ic{font-size:22px;}
  .kpi-tx{font-size:15px;font-weight:800;color:var(--ink);}
  .kpi-num{margin-left:auto;font-size:26px;font-weight:800;color:var(--teal2);line-height:1;}
  .kpi-in.hit .kpi-num{color:var(--teal);}
  .kpi-tg{font-size:12px;font-weight:800;color:#9aa8a4;background:#f2f7f5;padding:3px 9px;border-radius:20px;}
  .kpi-sub{font-size:11px;color:#9aa8a4;padding:5px 4px 0;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <img src="apple-touch-icon.png" alt="IMG">
    <div class="ttl">店員助手</div>
    <button class="plan-btn" id="planBtn">📋 今日</button>
    <div class="badge" id="badge"></div>
  </header>
  <div id="notice"></div>
  <div id="msgs"></div>
  <footer>
    <textarea id="q" rows="1" placeholder="打你想問嘅嘢…" enterkeyhint="send"></textarea>
    <button id="send">問</button>
  </footer>
</div>

<div id="gate">
  <img class="logo" src="apple-touch-icon.png" alt="IMG">
  <h1>IMG 店員助手</h1>
  <div class="sub">前線同事專用 · 入你自己嘅登入碼</div>
  <div class="card">
    <label>你嘅登入碼</label>
    <input id="pin" type="tel" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="＿＿＿＿">
    <div class="err" id="g_err"></div>
    <button class="go" id="g_go">開始用</button>
    <div class="hint">每人一個碼，唔好借人。唔記得碼搵 Ivan。</div>
  </div>
</div>

<div id="plan">
  <div class="ph"><div class="t">📋 今日流程</div><button class="x" id="planClose">✕</button></div>
  <div class="kpi" id="kpi"></div>
  <div class="body" id="planBody"></div>
  <div class="tip">打勾淨係方便你自己記住，每日自動清。</div>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbyvoP33UIINAsBdm5X0FXTq0Qp6sFcvYshJOKyzziASDqjiyDV_Q3yxWn1GlRAMQOQY/exec';
var LS=window.localStorage;
var PIN=LS.getItem('img_pin')||'', NAME=LS.getItem('img_name')||'', STORE=LS.getItem('img_store')||'';
var msgs=document.getElementById('msgs');
var qEl=document.getElementById('q'), sendBtn=document.getElementById('send');
var busy=false, seq=0;

function jsonp(params){
  return new Promise(function(resolve){
    var cb='j'+(seq++)+'_'+Math.floor(performance.now());
    var s=document.createElement('script');
    var done=false;
    window[cb]=function(d){ done=true; try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); resolve(d); };
    var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k]);}).join('&');
    s.src=API+'?'+qs+'&callback='+cb;
    s.onerror=function(){ if(!done){done=true; if(s.parentNode)s.parentNode.removeChild(s); resolve({error:1});} };
    document.body.appendChild(s);
    setTimeout(function(){ if(!done){done=true; if(s.parentNode)s.parentNode.removeChild(s); resolve({timeout:1});} }, 30000);
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function addBubble(text, who, cls){
  var row=document.createElement('div');
  row.className='row '+who+(cls?' '+cls:'');
  var b=document.createElement('div'); b.className='bub';
  if(who==='bot' && !cls){ b.innerHTML=fmt(text); } else { b.textContent=text; }
  row.appendChild(b); msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
  return row;
}

function greet(){
  addBubble('你好 '+NAME+' 👋 有咩幫到你？打你想問嘅嘢，或者打單號查沖印進度。', 'bot');
}

async function loadNotice(){
  var r=await jsonp({notice:'1'});
  var n=(r&&r.notice)?String(r.notice).trim():'';
  if(n){ var el=document.getElementById('notice'); el.innerHTML='<b>公告：</b>'+n.replace(/</g,'&lt;'); el.style.display='block'; }
}

async function send(){
  if(busy) return;
  var t=qEl.value.trim();
  if(!t) return;
  qEl.value=''; autolimit();
  addBubble(t,'me');
  busy=true; sendBtn.disabled=true;
  var typing=addBubble('諗緊…','bot','typing');
  var r=await jsonp({api:'1', code:PIN, q:t});
  typing.parentNode.removeChild(typing);
  busy=false; sendBtn.disabled=false;
  var reply=(r&&r.reply)?r.reply:'';
  if(r&&(r.error||r.timeout)){ addBubble('網絡唔穩定，遲少少再試多次 🙏','bot'); return; }
  if(reply.indexOf('⛔')===0){
    addBubble(reply,'bot');
    LS.removeItem('img_pin'); PIN='';
    setTimeout(function(){ showGate('登入碼過期或者停咗，麻煩再入一次。'); }, 800);
    return;
  }
  addBubble(reply||'（暫時冇回覆，試多次）','bot');
}

function autolimit(){ qEl.style.height='auto'; qEl.style.height=Math.min(qEl.scrollHeight,120)+'px'; }
qEl.addEventListener('input', autolimit);
qEl.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);

/* ---------- gate ---------- */
function showGate(msg){
  document.getElementById('gate').style.display='flex';
  document.getElementById('g_err').textContent=msg||'';
  document.getElementById('pin').value='';
}
function hideGate(){ document.getElementById('gate').style.display='none'; }

async function tryLogin(){
  var pw=document.getElementById('pin').value.trim();
  var err=document.getElementById('g_err');
  if(!pw){ err.textContent='入你嘅登入碼'; return; }
  err.textContent='檢查緊…';
  var go=document.getElementById('g_go'); go.disabled=true;
  var r=await jsonp({login:'1', code:pw});
  go.disabled=false;
  if(r&&(r.error||r.timeout)){ err.textContent='網絡唔通，再試一次'; return; }
  if(!r || !r.ok){ err.textContent='登入碼唔啱，搵 Ivan 攞返'; return; }
  PIN=pw; NAME=r.name||''; STORE=r.store||'';
  LS.setItem('img_pin',pw); LS.setItem('img_name',NAME); LS.setItem('img_store',STORE);
  startChat(true);
}
document.getElementById('g_go').addEventListener('click', tryLogin);
document.getElementById('pin').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); tryLogin(); } });

function startChat(fresh){
  hideGate();
  document.getElementById('badge').textContent=(STORE?STORE+' · ':'')+NAME;
  if(fresh){ msgs.innerHTML=''; greet(); }
  loadNotice();
}

/* ---------- 今日流程 checklist ---------- */
var PLAN=[
  { key:'open', title:'☀️ 開舖', from:10, to:13, items:[
    '打卡 in（Infotech）',
    '開冷氣、開晒燈',
    '開銀箱點 float $2000 → 影相上 Drive（對唔到即搵經理，唔好自補）',
    '開沖機 + 掃描儀',
    '貓：鏟砂、加糧、換水',
    '補菲林 display（每款 4 卷）、補電池',
    '12:00 翻牌「營業中」、開門',
    '影店相上 Drive、覆 email / WhatsApp / IG DM',
    'IG story ≥ 4（tag 分店）',
    '試機片 ≥ 3'
  ]},
  { key:'day', title:'🕑 日中', from:13, to:19, items:[
    '客入店 3 秒內招呼',
    'email / WhatsApp / IG 每 2 鐘 check',
    '網單 check（早 / 午 / 晚）',
    'IG story 夠 4、試機片夠 3',
    '貓每 2 鐘睇水糧',
    '收銀跟 POS、折扣要 reason code',
    '慢時段：補貨、清潔、執沖印 backlog'
  ]},
  { key:'close', title:'🌙 收舖', from:19, to:24, items:[
    '19:30 填 Sales Target',
    '橙機日結、黑機（AE）日結',
    '20:00 翻牌關閉、鎖門（唔可早收）',
    'POS 黆錢箱對數（差 >$200 即搵經理）→ 留 $2000、餘額入錢袋',
    '影 4 張相 send WhatsApp「Imageplayground Shop」',
    '沖機支架泡水、關掃描儀、logout POS、關卡機叉電',
    '貓：糧水、清砂、開風扇',
    '執舖、倒垃圾',
    '巡舖鎖玻璃櫃、關燈、打卡 out、鎖門'
  ]}
];
function today_(){ var d=new Date(); return ''+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2); }
function pkey_(seg,idx){ return 'img_plan_'+today_()+'_'+seg+'_'+idx; }
function curSeg_(){ var h=new Date().getHours(); for(var i=0;i<PLAN.length;i++){ if(h>=PLAN[i].from && h<PLAN[i].to) return PLAN[i].key; } return 'day'; }
function renderPlan(){
  var cur=curSeg_(); var body=document.getElementById('planBody'); body.innerHTML='';
  PLAN.forEach(function(seg){
    var done=0; seg.items.forEach(function(_,i){ if(LS.getItem(pkey_(seg.key,i))==='1') done++; });
    var wrap=document.createElement('div'); wrap.className='seg'+(seg.key===cur?' open':'');
    var sh=document.createElement('div'); sh.className='sh';
    sh.innerHTML='<span class="chev">▶</span><span>'+seg.title+'</span>'+(seg.key===cur?'<span class="now">而家</span>':'')+'<span class="cnt">'+done+'/'+seg.items.length+'</span>';
    sh.onclick=function(){ wrap.classList.toggle('open'); };
    wrap.appendChild(sh);
    var items=document.createElement('div'); items.className='items';
    seg.items.forEach(function(txt,i){
      var on=LS.getItem(pkey_(seg.key,i))==='1';
      var it=document.createElement('div'); it.className='it'+(on?' done':'');
      it.innerHTML='<div class="box">'+(on?'✓':'')+'</div><div class="tx">'+esc(txt)+'</div>';
      it.onclick=function(){
        var now=LS.getItem(pkey_(seg.key,i))==='1';
        if(now){ LS.removeItem(pkey_(seg.key,i)); } else { LS.setItem(pkey_(seg.key,i),'1'); }
        renderPlan();
      };
      items.appendChild(it);
    });
    wrap.appendChild(items); body.appendChild(wrap);
  });
}
var KPI_TARGET=9;
async function loadKpi(){
  var el=document.getElementById('kpi');
  el.innerHTML='<div class="kpi-in"><span class="kpi-ic">📸</span><span class="kpi-tx">今日 IG story</span><span class="kpi-num">…</span></div><div class="kpi-sub">全店今日出咗幾多條 story</div>';
  var r=await jsonp({storycount:'1'});
  if(r && r.ok){
    var n=r.count||0; var hit=n>=KPI_TARGET;
    el.innerHTML='<div class="kpi-in'+(hit?' hit':'')+'"><span class="kpi-ic">📸</span><span class="kpi-tx">今日 IG story</span><span class="kpi-num">'+n+'</span><span class="kpi-tg">目標 '+KPI_TARGET+'</span></div><div class="kpi-sub">全店今日出咗幾多條 story'+(hit?' · 夠數 👍':'')+'</div>';
  } else {
    el.innerHTML='<div class="kpi-in"><span class="kpi-ic">📸</span><span class="kpi-tx">今日 IG story</span><span class="kpi-num">–</span></div><div class="kpi-sub">暫時攞唔到，遲少少再開</div>';
  }
}
document.getElementById('planBtn').addEventListener('click', function(){ renderPlan(); document.getElementById('plan').style.display='flex'; loadKpi(); });
document.getElementById('planClose').addEventListener('click', function(){ document.getElementById('plan').style.display='none'; });

/* ---------- boot ---------- */
if(PIN && NAME){ startChat(true); }
else { showGate(''); }
</script>
</body>
</html>
